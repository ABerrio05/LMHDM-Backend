spring:
  application:
    name: nexo-backend
  config:
    # Permite iniciar localmente con las variables de .env sin cargarlas a mano.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexo}
    username: ${DB_USERNAME:nexo_app}
    password: ${DB_PASSWORD:change_me}
    hikari:
      # Configurable por entorno: evita que la concurrencia espere el pool por defecto.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      # En equipos locales Docker puede pausar brevemente los contenedores. Estas
      # opciones validan y renuevan conexiones para evitar esperas prolongadas.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:600000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:120000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  developer:
    email: ${APP_DEVELOPER_EMAIL:}
  security:
    jwt-secret: ${JWT_SECRET:change-this-only-for-local-development-please}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    # El valor 10 se conserva como configuración segura por defecto.
    # Docker local puede reducirlo mediante BCRYPT_STRENGTH si el equipo es limitado.
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  calendar:
    base-url: ${HOLIDAY_API_BASE_URL:https://date.nager.at/api/v3}
  ai:
    enabled: ${AI_ENABLED:false}
    # Compatible con proveedores que expongan /chat/completions; la clave nunca se expone al cliente.
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
  notifications:
    reminder-poll-delay-ms: ${REMINDER_POLL_DELAY_MS:60000}
    email:
      enabled: ${EMAIL_ENABLED:false}
      from: ${EMAIL_FROM:no-reply@nexo.local}
      # Reintentos controlados para errores transitorios del proveedor SMTP.
      max-attempts: ${EMAIL_MAX_ATTEMPTS:3}
      retry-delay-ms: ${EMAIL_RETRY_DELAY_MS:300000}
