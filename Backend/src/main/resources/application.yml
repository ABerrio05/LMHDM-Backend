spring:
  application:
    name: nexo-backend
  config:
    # Permite iniciar localmente con las variables de .env sin cargarlas a mano.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexo}
    username: ${DB_USERNAME:nexo_app}
    password: ${DB_PASSWORD:change_me}
    hikari:
      # Configurable por entorno: evita que la concurrencia espere el pool por defecto.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      # En equipos locales Docker puede pausar brevemente los contenedores. Estas
      # opciones validan y renuevan conexiones para evitar esperas prolongadas.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:600000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:120000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-only-for-local-development-please}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    # El valor 10 se conserva como configuración segura por defecto.
    # Docker local puede reducirlo mediante BCRYPT_STRENGTH si el equipo es limitado.
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  calendar:
    base-url: ${HOLIDAY_API_BASE_URL:https://date.nager.at/api/v3}
